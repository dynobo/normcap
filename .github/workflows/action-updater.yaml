name: GitHub Actions Version Updater

on:
  schedule:
    # Automatically run on every Sunday
    - cron:  '0 0 * * 0'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # The updater pushes with a plain `git push` and never passes the token
      # itself, so it relies on the PAT that checkout persists in the git
      # config. Nothing in this job uploads the workspace, which is why the
      # credential can't leak through an artifact.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: # zizmor: ignore[artipacked] required by the updater, see above
          token: ${{ secrets.WORKFLOW_SECRET }}

      - name: Run GitHub Actions Version Updater
        uses: saadmk11/github-actions-version-updater@a5ab9b51373a6dbfd2732a985e60ef23e172792a # v1.0.1
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
          # Local composite actions pin third-party actions too; they live
          # outside .github/workflows, so they need an explicit location.
          # Directories are scanned recursively.
          extra_workflow_locations: ".github/actions"
