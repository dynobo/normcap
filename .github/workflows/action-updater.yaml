name: GitHub Actions Version Updater

on:
  schedule:
    # Automatically run on every Sunday
    - cron:  '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}

      - name: Run GitHub Actions Version Updater
        uses: saadmk11/github-actions-version-updater@v1.0.1
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
          # Local composite actions pin third-party actions too; they live
          # outside .github/workflows, so they need an explicit location.
          # Directories are scanned recursively.
          extra_workflow_locations: ".github/actions"
