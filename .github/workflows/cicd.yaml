# Infos on current github runners:
# https://docs.github.com/en/actions/reference/runners/github-hosted-runners#single-cpu-runners

name: CI/CD

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      refToBuild:
        description: "Branch, tag or commit SHA1 to build"
        required: true
        type: string

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: Lint & Test
    permissions:
      checks: write
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, windows-2022, windows-2025, ubuntu-22.04, ubuntu-24.04]
    steps:
      # Setup environment
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name != 'workflow_dispatch' }}
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ inputs.refToBuild }}
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Prepare Linux
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install \
            python3-pil \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-jpn \
            tesseract-ocr-chi-sim \
            xclip
          sudo apt-get install \
            xvfb \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libxcb-xfixes0 \
            libxcb-shape0 \
            libxcb-cursor0 \
            libegl1 \
            libegl1-mesa-dev
          sudo apt-get install \
            ca-certificates
          echo "XDG_SESSION_TYPE=gnome" >> $GITHUB_ENV
          echo "QT_DEBUG_PLUGINS=1" >> $GITHUB_ENV
          echo "QT_QPA_PLATFORM=xcb" >> $GITHUB_ENV

      - name: Prepare macOS
        if: startsWith(matrix.os, 'macos')
        run: |
          brew trust --formula coverallsapp/coveralls/coveralls
          brew install tesseract tesseract-lang dylibbundler
          brew info tesseract

      - name: Prepare Windows
        if: startsWith(matrix.os, 'windows')
        run: |
          $url = "https://digi.bib.uni-mannheim.de/tesseract/tesseract-ocr-w64-setup-5.4.0.20240606.exe"
          Invoke-WebRequest -Uri $url -OutFile "tesseract_installer.exe"
          7z x tesseract_installer.exe -O"C:\Program Files\Tesseract-OCR"

          $chi_sim_url = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/chi_sim.traineddata"
          Invoke-WebRequest -Uri $chi_sim_url -OutFile "C:\Program Files\Tesseract-OCR\tessdata\chi_sim.traineddata"
          $jpn_url = "https://github.com/tesseract-ocr/tessdata_fast/raw/main/jpn.traineddata"
          Invoke-WebRequest -Uri $jpn_url -OutFile "C:\Program Files\Tesseract-OCR\tessdata\jpn.traineddata"

          $tesseract = "C:\Program Files\Tesseract-OCR\"
          echo "$tesseract" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "TESSDATA_PREFIX=$tesseract\tessdata" >> $env:GITHUB_ENV
          Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Test tesseract
        run: |
          tesseract --version
          tesseract --list-langs

      - name: Run project checks
        run: |
          uv run poe cicd-check
        env:
          QT_DEBUG_PLUGINS: 1

      - name: Coveralls Parallel
        if: github.repository_owner == 'dynobo'
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: ${{ matrix.os }}
          path-to-lcov: coverage.lcov
          parallel: true

  test-python-package:
    name: Test Python package build
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Test build python package
        run: uv build

  test-flatpak:
    name: Test flatpak build
    permissions:
      # Needed to create the internal draft release below.
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install flatpak
        run: |
          sudo apt update && sudo apt install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Clone flathub repo
        shell: bash
        run: git clone https://github.com/flathub/com.github.dynobo.normcap.git

      - name: Run build script
        env:
          SOURCE: >-
            ${{ github.event_name == 'workflow_dispatch'
            && inputs.refToBuild
            || github.sha }}
        run: |
          cd com.github.dynobo.normcap
          python update.py --keep --bundle "$SOURCE"

      - name: Draft internal release
        uses: $/.github/actions/draft-release
        # It's possible, that the run lacks release permissions (e.g. on forks).
        # This is not crucial, so we just silence the error.
        continue-on-error: true
        if: github.repository_owner == 'dynobo'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: internal
          title: Internal
          body: Only for internal tests. Should not be published.
          prerelease: true
          artifacts: "*/*.dmg */*.AppImage */*.msi */*.zip */*.flatpak"

  test-briefcase:
    name: Test Briefcase build
    permissions:
      # Needed to create the internal draft release below.
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Test build briefcase package
        shell: bash -l {0}
        run: uv run poe bundle-dev
      - name: Print briefcase log in case of error
        if: failure()
        shell: bash -l {0}
        run: |
          (cat logs/briefcase*) || true
          find build/normcap || true

      - name: Draft internal release
        uses: $/.github/actions/draft-release
        # It's possible, that the run lacks release permissions (e.g. on forks).
        # This is not crucial, so we just silence the error.
        continue-on-error: true
        if: github.repository_owner == 'dynobo'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: internal
          title: Internal
          body: Only for internal tests. Should not be published.
          prerelease: true
          artifacts: "*/*.dmg */*.AppImage */*.msi */*.zip */*.flatpak"

  test-documentation:
    name: Test documentation build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Build documentation
        run: uv run poe docs-build

  coveralls:
    name: Upload coverage
    permissions:
      checks: write
      contents: read
    needs: test
    if: github.repository_owner == 'dynobo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["python"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - name: Autobuild
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0

  deploy-briefcase:
    name: Briefcase build & draft release
    permissions:
      # Needed to create/update the draft release and upload artifacts.
      contents: write
    needs:
      - test
      - test-briefcase
      - test-flatpak
      - test-python-package
    if: |
      startsWith(github.ref, 'refs/tags/v')
      && github.repository_owner == 'dynobo'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Build package briefcase
        shell: bash -l {0}
        run: uv run poe bundle
      - name: Draft release
        uses: $/.github/actions/draft-release
        if: github.repository == 'dynobo/normcap'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          body: >-
            See the
            [CHANGELOG](https://github.com/dynobo/normcap/blob/main/CHANGELOG)
            for details.
      - name: FTP upload windows package
        if: startsWith(matrix.os, 'windows') && github.repository == 'dynobo/normcap'
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287 # v4.4.0
        with:
          server: ${{ secrets.WEBGO_FTP_HOST }}
          username: ${{ secrets.WEBGO_FTP_USER }}
          password: ${{ secrets.WEBGO_FTP_PASS }}
          protocol: ftps
          local-dir: ./bundle/
          exclude: |
            **/platforms/**
            **/imgs/**
            **/*.py
            **/*.wxs
            **/*.wxs
            **/metainfo

  deploy-pypi:
    name: Publish to PyPi
    needs: deploy-briefcase
    runs-on: ubuntu-24.04
    permissions:
      # Used to build the package from the checked out sources.
      contents: read
      # Used to authenticate to PyPI via OIDC.
      # Used to sign the release's artifacts with sigstore-python.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Build Python package
        run: uv build
      - name: Publish to PyPi
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          verbose: true
          print-hash: true

  release-documentation:
    name: Deploy github pages
    permissions:
      # Needed to push the built documentation to the gh-pages branch.
      contents: write
    needs:
      - test
      - test-documentation
    if: |
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
      && github.repository_owner == 'dynobo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python-uv

      - name: Build documentation
        run: uv run poe docs-build
      - name: Deploy pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
